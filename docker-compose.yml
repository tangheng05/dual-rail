services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dual_rail
      POSTGRES_PASSWORD: dual_rail
      POSTGRES_DB: dual_rail
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dual_rail -d dual_rail"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgres://dual_rail:dual_rail@postgres:5432/dual_rail
      RUST_LOG: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
