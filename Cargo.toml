[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.94"

[workspace.dependencies]
dual-rail-core = { path = "crates/core" }
dual-rail-rails = { path = "crates/rails" }
dual-rail-store = { path = "crates/store" }

anyhow = "1.0.104"
async-stripe = { version = "=1.0.0-rc.9", default-features = false, features = ["rustls-aws-lc-rs", "rustls-tls-webpki-roots"] }
async-stripe-core = { version = "=1.0.0-rc.9", features = ["payment_intent"] }
async-stripe-shared = "=1.0.0-rc.9"
async-stripe-types = "=1.0.0-rc.9"
async-trait = "0.1.92"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
hex = "0.4.3"
hmac = "0.13.0"
khqr-api = "0.4.1"
khqr-core = "0.4.1"
rustls = "0.23.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate", "uuid", "time", "json"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde-human-readable", "formatting", "parsing", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7.19"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
wiremock = "0.6.5"
